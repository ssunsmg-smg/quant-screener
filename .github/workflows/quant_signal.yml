name: 장중 매매 (손절/트레일링 익절 + L1+L2 매수 게이트)

# ── v2 수정본 (2026-08-09) ──────────────────────────────────
# [수정 1] ★ 매매신호 JSON 준비 단계 추가 ★
#     quant_daily.yml 은 신호 JSON을 signals/ 폴더에만 커밋하는데
#     이 워크플로우는 `--output-dir .` 로 레포 루트를 뒤지고 있었다.
#     → 항상 "파일 없음"으로 조용히 종료(exit 0), 초록불.
#     quant_trade.yml 에는 있는 `cp signals/... .` 단계가 여기만 빠져 있었다.
#     이제 quant_trade.yml 과 동일하게 준비 단계를 두고, 없으면 exit 1.
#
# [수정 2] 거래상태(trade_state) 복원/저장 추가.
#     quant_trade.yml 과 재투자 자금 풀(reinvest_pool.json)을 공유해야
#     같은 돈을 두 워크플로우가 중복 배정하지 않는다.
#
# [수정 3] is_real 정규화 + JSON 검증.
#     `"is_real": ${{ secrets.KIS_IS_REAL }}` 는 따옴표가 없어서
#     시크릿이 비었거나 "True"(파이썬 표기)면 JSON이 깨진다.
#     → _load_config()가 예외를 삼켜 cfg={} → "앱키 미설정" → 조용히 종료.
#     이제 소문자 true/false 로 정규화하고, 생성 직후 파싱 검증한다.
#
# [수정 4] push 충돌 재시도 + concurrency 그룹.
#     10~15분마다 도는 이 워크플로우와 10시 quant_trade.yml 이 같은
#     브랜치에 push 하므로 non-fast-forward 충돌이 잦다.
# ────────────────────────────────────────────────────────────

on:
  # ── [수정 5] schedule 트리거 추가 ──
  # 원래는 "GitHub schedule은 정시 보장이 안 된다"는 이유로 VPS cron에
  # 맡겨져 있었다. 그런데 실행 이력을 확인해보니 VPS cron이 이 워크플로우를
  # 2개월 동안 단 한 번도 트리거한 적이 없었다(수동 1회가 전부).
  # 몇 분 지연되는 것보다 아예 안 도는 게 훨씬 큰 문제이므로 schedule을 넣는다.
  #
  # cron은 UTC 기준이다. KST = UTC+9 이므로
  #   00:05~05:50 UTC = 09:05~14:50 KST (정규장 구간)
  # 요일도 UTC 기준이지만, 이 시간대는 KST와 같은 날짜라 1-5(월~금) 그대로 맞다.
  # ★ 매수 컷오프는 14:50 이지만 매도 컷오프는 15:20 이므로,
  #   14:50 이후에도 2회 더 돌려 마감 직전 손절/익절 기회를 남긴다.
  #   (그 시간대 실행은 매도만 하고 신규 매수는 스킵한다)
  schedule:
    - cron: '5,20,35,50 0-5 * * 1-5'   # 09:05~14:50 KST — 매도+매수
    - cron: '5,20 6 * * 1-5'           # 15:05, 15:20 KST — 매도만

  workflow_dispatch:   # 수동 실행 버튼 (테스트용)

permissions:
  contents: write   # pending 상태 파일과 거래상태를 레포에 커밋하기 위해 필요

# 같은 브랜치에 push하는 워크플로우끼리 겹치지 않게 직렬화.
# cancel-in-progress: false — 진행 중인 매수 판단을 중간에 죽이면 안 된다.
concurrency:
  group: kis-trading-state
  cancel-in-progress: false

jobs:
  signal-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 레포지터리 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ★ 핵심 수정: quant_trade.yml 과 동일한 신호파일 준비 단계
      #   (이 단계가 없어서 지금까지 매수가 한 번도 실행되지 않았다)
      - name: 매매신호 JSON 준비
        run: |
          if [ -z "$(ls -A signals/매매신호_KR_*.json 2>/dev/null)" ]; then
            echo "❌ signals/ 폴더에 매매신호 JSON이 없습니다."
            echo "   전날 스크리닝(quant_daily.yml)이 먼저 성공해야 합니다."
            exit 1
          fi
          cp signals/매매신호_KR_*.json .
          echo "▶ 신호 파일 준비 완료:"
          ls -la 매매신호_KR_*.json

      # 재투자 자금 풀 / 보유포지션을 quant_trade.yml 과 공유
      # (trade_state/ = git 추적, trades/ = 스크립트가 읽는 경로)
      - name: 거래상태 복원
        run: |
          mkdir -p trades trade_state data/intraday
          for f in positions.json reinvest_pool.json peaks.json; do
            if [ -f "trade_state/$f" ]; then
              cp "trade_state/$f" "trades/$f"
              echo "▶ $f 복원 완료"
            else
              echo "▶ 저장된 $f 없음 (최초 실행)"
            fi
          done
          # 오늘자 pending 상태도 복원 (10분 뒤 실행이 재시도 횟수를 이어받도록)
          TODAY=$(TZ=Asia/Seoul date '+%Y%m%d')
          if [ -f "trade_state/intraday_pending_${TODAY}.json" ]; then
            cp "trade_state/intraday_pending_${TODAY}.json" "trades/"
            echo "▶ pending 상태 복원 완료 (${TODAY})"
          fi

      - name: KIS 설정파일 생성
        env:
          KIS_APP_KEY:    ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_IS_REAL:    ${{ secrets.KIS_IS_REAL }}
        run: |
          set -euo pipefail

          # ★ is_real 정규화 — 비어있거나 "True"/"TRUE"/"1" 같은 값이 와도
          #   유효한 JSON 불리언이 되도록. 알 수 없는 값은 안전하게 false(모의투자).
          RAW=$(printf '%s' "${KIS_IS_REAL:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case "$RAW" in
            true|1|yes|y) IS_REAL=true ;;
            *)            IS_REAL=false ;;
          esac
          if [ "$RAW" != "true" ] && [ "$RAW" != "false" ]; then
            echo "⚠ KIS_IS_REAL 시크릿 값이 '$RAW' 입니다 → ${IS_REAL} 로 해석했습니다."
            echo "  (권장: 시크릿에 정확히 true 또는 false 만 넣을 것)"
          fi

          # 앱키가 비어 있으면 여기서 바로 중단 — 나중에 조용히 no-op 되는 것보다 낫다
          if [ -z "${KIS_APP_KEY:-}" ] || [ -z "${KIS_APP_SECRET:-}" ]; then
            echo "❌ KIS_APP_KEY / KIS_APP_SECRET 시크릿이 비어 있습니다."
            exit 1
          fi

          # jq 로 생성 — 특수문자(app_secret 의 / + = 등)가 있어도 안전하게 이스케이프됨
          jq -n \
            --arg  app_key    "$KIS_APP_KEY" \
            --arg  app_secret "$KIS_APP_SECRET" \
            --arg  account_no "${KIS_ACCOUNT_NO:-}" \
            --argjson is_real "$IS_REAL" \
            '{
              app_key: $app_key,
              app_secret: $app_secret,
              account_no: $account_no,
              is_real: $is_real,
              max_daily_trades: 10,
              stop_loss_pct: 7.0,
              take_profit_min_pct: 3.0,
              take_profit_max_pct: 25.0,
              trail_trigger_pct: 3.0,
              trail_drop_pct: 2.0,
              base_invest_amount: 10000000,
              reinvest_mode: true,
              buy_top_n: 20
            }' > kis_config.json

          # 생성 결과 검증 (깨진 JSON이 조용히 넘어가지 않도록)
          python -c "import json;c=json.load(open('kis_config.json'));assert c['app_key'];print('▶ kis_config.json 검증 OK (is_real=%s)'%c['is_real'])"

      # [수정 6] 텔레그램 설정 — quant_trade.yml 에는 있고 여기만 빠져 있었다.
      #   그래서 장중에 매수가 체결돼도 폰에 아무 알림이 안 왔다.
      #   시크릿이 비어 있으면 파일을 만들지 않는다 → 스크립트가 알림 없이 그냥 진행.
      #   (알림 설정 누락 때문에 매매가 멈추면 안 된다)
      - name: 텔레그램 설정파일 생성
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "▶ 텔레그램 시크릿 없음 — 알림 없이 진행합니다"
            exit 0
          fi
          jq -n --arg t "$TELEGRAM_BOT_TOKEN" --arg c "$TELEGRAM_CHAT_ID" \
            '{bot_token: $t, chat_id: $c}' > telegram_config.json
          echo "▶ 텔레그램 설정파일 생성 완료"

      - name: 장중 매도점검 + 매수게이트 실행
        run: |
          python quant_signal_check.py --output-dir signals --interval 5
          echo "▶ 실행 완료"

      - name: 설정파일 삭제
        if: always()
        run: rm -f kis_config.json telegram_config.json

      # pending 상태 + 거래상태(재투자풀/포지션) + 누적 분봉/게이트 로그를
      # 다음 실행에서 이어 쓰고 나중에 백테스트 데이터로 쓰려면 레포에 커밋해서 영속화
      - name: 거래상태 + 누적 데이터 커밋
        if: always()
        run: |
          mkdir -p trade_state
          cp trades/positions.json      trade_state/ 2>/dev/null || true
          cp trades/reinvest_pool.json  trade_state/ 2>/dev/null || true
          # ★ peaks.json = 트레일링 스톱의 고점 기록.
          #   이게 유실되면 다음 실행에서 고점이 현재가로 리셋되어
          #   이미 armed 된 종목이 트레일링 매도를 놓친다. 반드시 영속화.
          cp trades/peaks.json          trade_state/ 2>/dev/null || true
          cp trades/intraday_pending_*.json trade_state/ 2>/dev/null || true

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # data/intraday/ 가 .gitignore 에 걸려 있으면 -f 로 강제 추가
          git add trade_state/ 2>/dev/null || true
          git add -f data/intraday/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "▶ 변경사항 없음"
          else
            git commit -m "장중 시그널 상태 + 분봉/게이트 로그 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
            # 10분마다 도는 워크플로우라 push 충돌이 잦다 → rebase 후 재시도
            for i in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "▶ push 성공"; break
              fi
              echo "▶ push 충돌 — rebase 후 재시도 ($i/3)"
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              sleep 5
            done
          fi

      - name: 거래로그 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 시그널체크로그-${{ github.run_number }}-${{ github.run_id }}
          path: trades/*.json
          retention-days: 30
          if-no-files-found: warn
